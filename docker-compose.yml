# Local development dependencies. Mirrors the AWS services:
#   postgres  -> RDS PostgreSQL 16 + PostGIS
#   redis     -> ElastiCache Redis 7
#   sqs       -> Amazon SQS (ElasticMQ speaks the SQS API)
#   s3        -> Amazon S3 + CloudFront for photos (S3Mock; objects readable without auth)
#   opensearch -> Amazon OpenSearch Service (security plugin off locally; IAM auth in AWS)
name: activity-app

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: activity
      POSTGRES_PASSWORD: activity
      POSTGRES_DB: activity
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U activity -d activity']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  sqs:
    image: softwaremill/elasticmq-native:1.6.14
    ports:
      - '9324:9324'
      - '9325:9325'
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro

  s3:
    image: adobe/s3mock:5.2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: activity-photos
    ports:
      - '9090:9090'

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      # Dev laptops are often nearly full; don't let disk watermarks block index creation.
      cluster.routing.allocation.disk.threshold_enabled: 'false'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
